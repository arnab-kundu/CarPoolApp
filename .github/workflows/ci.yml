name: Foundation checks
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew assembleDebug testDebugUnitTest assembleDebugAndroidTest lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: {name: android-debug, path: android/app/build/outputs/apk/debug/app-debug.apk}
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env: {POSTGRES_USER: carpool, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: carpool_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carpool -d carpool_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run: {working-directory: backend}
    env:
      DATABASE_URL: postgresql://carpool:ci-only-password@localhost:5432/carpool_test
      TEST_DATABASE_URL: postgresql://carpool:ci-only-password@localhost:5432/carpool_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: backend/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm run migrate
      - run: npm test
